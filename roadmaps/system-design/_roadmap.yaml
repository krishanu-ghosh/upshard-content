slug: system-design
title: System Design
description: >-
  How a system is actually designed to handle scale: the estimation and tradeoff
  habits, the networking and API choices, load balancing, caching, data modeling and
  storage at scale, consistency/availability/consensus, asynchronous messaging,
  reliability patterns, architecture patterns, and observability and security at
  scale that a production system needs — closing with worked, end-to-end case
  studies of the classic system-design interview problems. Sixty lessons that assume
  the core data structures and algorithms, and general computer science, as a
  starting point (see datastructures-and-algorithms and computer-science).
level: intermediate
status: published
tags: [interview-prep, infra]

# Our own structure. roadmap.sh's System Design tree was read for topic coverage
# only, as private inspiration (§13, §16); no third-party tree, description, or
# link list is reproduced here. Twelve groups, roughly in teaching order:
# fundamentals and estimation, then the request path outward-in (networking/APIs,
# load balancing, caching), then storage (data modeling, scaling data and
# services), then the harder distributed-systems ground (consistency/availability/
# consensus, async messaging, reliability patterns), then how production systems
# are actually composed (architecture patterns, observability and security), and
# finally worked case studies that pull every earlier group together. Nine nodes
# (data-modeling-and-storage's three, scaling-data-and-services' two,
# consistency-availability-and-consensus's one, caching-at-scale's one,
# async-systems-and-messaging's one, networking-apis-and-communication's one)
# moved in from computer-science, where they were either a misplaced
# "system-design-fundamentals" group or database-at-scale material that belongs
# here, not there — see PLAN.md §23.
groups:
  - slug: design-fundamentals-and-estimation
    title: Design fundamentals & estimation
    nodes:
      - what-is-system-design
      - performance-vs-scalability
      - latency-vs-throughput
      - back-of-the-envelope-estimation

