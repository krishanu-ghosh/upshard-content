slug: ai-product-builder
title: AI Product Builder
description: >-
  Going from an idea to a shipped product by directing AI tools rather than
  writing every line by hand — picking a prototyping tool, working an AI
  coding agent on a real codebase, and still knowing enough HTML, React, and
  testing to judge what it hands back and ship it responsibly. Thirty lessons
  from problem definition through deployment and running costs.
level: intermediate
status: published
tags: [building-products, prompting]

# Our own structure. roadmap.sh's AI Product Builder tree was read for topic
# coverage only, as private inspiration (§13, §16); no third-party tree,
# description, or link list is reproduced here. Six groups: define the
# problem, prototype it with AI, learn the baseline literacy needed to judge
# what AI writes, use AI coding agents on a real codebase, test what gets
# built, then ship and operate it.
groups:
  - slug: foundations
    title: Foundations
    nodes:
