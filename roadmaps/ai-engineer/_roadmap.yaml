slug: ai-engineer
title: AI Engineer
description: >-
  Building products on top of models you did not train. Thirty-six lessons from
  what a token is through retrieval, agents, evaluation and safety, to the work
  of keeping an LLM feature alive in production.
level: intermediate
status: published
tags: [core-ai, building-products]

# Our own structure. Public roadmaps were read for topic coverage and ordering
# only; no third-party tree, description or link list is reproduced here (§13,
# §16). The shape differs from them deliberately: eight groups that each answer
# one question, four or five nodes each, so a band is one or two rows of the
# graph and a sitting's worth of the path.
groups:
  - slug: foundations
    title: What you are actually building on
    nodes:
      - what-is-an-ai-engineer
      - how-llms-work
      - tokens-and-tokenization
      - embeddings

  - slug: working-with-models
    title: Talking to a model
    nodes:
      - the-context-window
      - calling-a-model-api
      - sampling-parameters
      - structured-output
      - choosing-a-model

  - slug: prompting
    title: Prompt and context engineering
    nodes:
      - prompt-anatomy
      - few-shot-prompting
      - chain-of-thought
      - context-engineering
      - prompt-caching

  - slug: retrieval
    title: Giving the model your data
    nodes:
      - chunking
      - vector-databases
      - similarity-search
      - rag-pipeline
      - rag-vs-fine-tuning

  - slug: agents
    title: Models that take actions
    nodes:
      - what-is-an-agent
      - tool-calling
      - the-agent-loop
      - model-context-protocol
      - multi-agent-systems

  - slug: evaluation
    title: Knowing whether it works
    nodes:
      - why-evals-matter
      - building-an-eval-set
      - llm-as-judge
      - tracing-and-observability

  - slug: safety
    title: Where it goes wrong
    nodes:
      - prompt-injection
      - guardrails-and-moderation
      - bias-and-fairness
      - privacy-and-data-handling

  - slug: production
    title: Shipping it
    nodes:
      - fine-tuning
      - multimodal-ai
      - cost-and-latency
      - shipping-and-monitoring

