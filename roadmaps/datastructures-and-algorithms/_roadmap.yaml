slug: datastructures-and-algorithms
title: Data Structures & Algorithms
description: >-
  Complete on its own: the core data structures and algorithms from the ground up
  (complexity, arrays/lists/stacks/queues, hash tables, trees and heaps, graphs,
  sorting, searching, recursion, greedy, backtracking, dynamic programming), then
  everything computer-science doesn't cover — advanced trees and range-query
  structures, disjoint sets and graph-structure algorithms, shortest-path algorithms
  that handle negative weights and heuristics, non-comparison sorting, the design
  techniques behind divide-and-conquer and randomization, advanced string matching,
  and the full interview pattern catalog: two pointers, sliding window, merge
  intervals, cyclic sort, top-k/two-heaps, subsets and permutations, classic DP, and
  the rest of what LeetCode-style problems are actually built from.
level: beginner
status: published
tags: [interview-prep, foundations]

# Our own structure. roadmap.sh's Data Structures & Algorithms tree was read for
# topic coverage only, as private inspiration (§13, §16); no third-party tree,
# description, or link list is reproduced here. Self-contained by design: unlike an
# earlier draft of this roadmap, it does not assume computer-science's data
# structures lessons — the fundamentals that used to live there now live here, so
# someone can learn DS&A start to finish from this roadmap alone. Fourteen groups:
# complexity and the core structures/algorithms built on it, then everything beyond
# that ground — advanced structures, graph-structure algorithms, shortest-path
# algorithms, sorting, design technique, string matching, and the interview pattern
# vocabulary.
