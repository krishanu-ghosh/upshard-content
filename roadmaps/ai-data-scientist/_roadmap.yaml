slug: ai-data-scientist
title: AI Data Scientist
description: >-
  The statistical and experimental reasoning that sits underneath modern AI
  work — distributions, hypothesis tests, causal inference, and A/B design —
  paired with the coding and EDA habits that turn raw data into a defensible
  answer, then into a model whose numbers can be explained to someone who
  didn't build it. Twenty-nine lessons from what the role actually is through
  shipping and communicating a result.
level: intermediate
status: published
tags: [ml-fundamentals, data-science]

# Our own structure. roadmap.sh's AI and Data Scientist tree is a short,
# high-level list (~10 topics: Mathematics, Statistics, Econometrics, Coding,
# EDA, Machine Learning, Deep Learning, MLOps, Vibe Coding, AI Engineering)
# that mostly points at prerequisite roadmaps rather than teaching its own
# content — read only as private inspiration for topic coverage (§13, §16; no
# third-party tree, description, or link list is reproduced here). Because
# `machine-learning`, `mlops`, and `ai-engineer` already exist as full Upshard
# roadmaps, this one spends its lessons on what a data scientist does that
# those don't cover — statistical inference, econometrics and experiment
# design, applied EDA, and judging/communicating a model's result — and links
# out to the dedicated roadmaps for deep-learning and production-MLOps depth
# rather than re-teaching them. Seven groups: what the role is, the
# statistics underneath it, econometrics and experimentation, the coding
# habits, exploratory analysis, applied modeling, then shipping and
# communicating the result.
groups:
  - slug: foundations
    title: Foundations
    nodes:
      - what-is-a-data-scientist
      - the-data-science-lifecycle
