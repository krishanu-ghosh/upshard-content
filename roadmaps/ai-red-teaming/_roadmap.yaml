slug: ai-red-teaming
title: AI Red Teaming
description: >-
  Finding the ways a model, its prompts, and the systems around it can be
  broken — before someone else does. Twenty-four lessons from prompt
  injection and jailbreaks through model extraction, poisoning, and agentic
  exploits, to the testing methodology and defenses a real engagement runs on.
level: advanced
status: published
tags: [safety, core-ai]

# Our own structure. Public roadmaps were read for topic coverage and
# ordering only; no third-party tree, description or link list is reproduced
# here (§13, §16). Six groups: what the field is, then three attack surfaces
# (prompt, model, system), then how an engagement is actually run, then
# defense and disclosure.
groups:
  - slug: foundations
    title: What AI red teaming actually is
    nodes:
      - what-is-ai-red-teaming
      - threat-modeling-for-ai-systems
      - the-owasp-top-10-for-llm-applications
      - rules-of-engagement-and-ethics

  - slug: prompt-attacks
    title: Attacking through the prompt
    nodes:
      - prompt-injection-direct-and-indirect
      - jailbreak-techniques
      - safety-filter-and-guardrail-bypasses
      - multi-turn-and-encoding-attacks

  - slug: model-attacks
    title: Attacking the model itself
    nodes:
      - model-extraction-and-weight-stealing
      - model-inversion-and-membership-inference
      - data-poisoning
      - adversarial-examples

  - slug: system-attacks
    title: Attacking the system around the model
    nodes:
      - insecure-deserialization-and-rce
      - api-and-infrastructure-security
      - rag-and-tool-attack-surface
      - agentic-ai-security

  - slug: methodology
    title: Running a red team engagement
    nodes:
      - black-box-grey-box-and-white-box-testing
      - automated-vs-manual-red-teaming
      - llm-security-testing-tools
      - building-a-red-team-lab

  - slug: defense
    title: Defending and reporting
    nodes:
      - guardrails-and-output-filtering
      - adversarial-training-and-robust-design
      - continuous-monitoring-and-detection
      - responsible-disclosure-and-reporting

