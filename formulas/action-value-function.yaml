slug: action-value-function
name: Action-value function
latex: "Q^{\\pi}(s, a) = \\mathbb{E}_{\\pi}\\!\\left[G_t \\mid S_t = s, A_t = a\\right]"
domains: [reinforcement-learning]
plain: >-
  How good one action is in one state, assuming you behave normally afterwards. Unlike
  the state value it names a choice, so a greedy policy can be read straight off it
  without a model of the environment.
symbols:
  - sym: "Q^{\\pi}"
    means: The action-value function under policy pi.
  - sym: "a"
    means: The action taken in state s.
